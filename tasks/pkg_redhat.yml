---
- name: Update apt or dnf cache
  ansible.builtin.package:
    update_cache: true
  become: true

- name: Ensure required packages are installed
  ansible.builtin.package:
    name:
      - podman
      - slirp4netns
      - python3-pip
      - shadow-utils
      - netavark
      - aardvark-dns
    state: present
  become: true
...
